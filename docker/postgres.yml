# BoltonCup PostgreSQL (standalone)
#
# Usage:
#   docker compose -f docker/postgres.yml --env-file .env up -d   # also creates the boltoncup-db network
#   docker compose -f docker/postgres.yml down
#   docker compose -f docker/postgres.yml down -v     # also deletes the data volume
#
# The WebAPI reaches Postgres as Server=postgres over boltoncup-db. The published port is only for
# tools off the host (Admin, psql): set POSTGRES_BIND to the host's tailnet IP, never 0.0.0.0.

services:
  postgres:
    image: postgres:17
    container_name: boltoncup-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bcadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-boltoncup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcadmin} -d ${POSTGRES_DB:-boltoncup}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  db:
    name: boltoncup-db