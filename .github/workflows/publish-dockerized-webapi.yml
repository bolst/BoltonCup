name: BoltonCup.WebAPI Docker Image CI

on:
  push:
    branches:
      - main
    # Every project the image builds, so a change to any of them is tested and deployed.
    paths:
      - 'src/BoltonCup.WebAPI/**'
      - 'src/BoltonCup.Application/**'
      - 'src/BoltonCup.Core/**'
      - 'src/BoltonCup.Integrations/**'
      - 'src/BoltonCup.Persistence/**'
      - 'src/BoltonCup.Shared/**'
      - 'src/BoltonCup.Telemetry/**'
      - '.github/workflows/publish-dockerized-webapi.yml'
      - 'docker/webapi.yml'
      - 'docker/postgres.yml'
      - 'tools/prepare_host.sh'
      - 'tools/check_compose_config.py'
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run tests
      run: |
        dotnet test src/BoltonCup.Application/tests/BoltonCup.Application.Tests.csproj --configuration Release --verbosity normal
        dotnet test src/BoltonCup.WebAPI/tests/BoltonCup.WebAPI.Tests.csproj --configuration Release --verbosity normal

  build:

    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./src
        file: src/BoltonCup.WebAPI/src/Dockerfile
        push: true
        tags: bolst/boltoncup-webapi:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # One SSH connection copies the deploy files and deploys: the host's ufw LIMIT rule blocks an IP after 6
    # connections in 30 seconds, and scp-action opens one per step.
    - name: Deploy
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      run: |
        set -euo pipefail
        key="$(mktemp)"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
        tar -czf - docker/webapi.yml docker/postgres.yml tools/prepare_host.sh tools/check_compose_config.py \
          | ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "root@$DEPLOY_HOST" '
              set -e
              cd /opt/BoltonCup
              tar -xzf - --no-same-owner
              bash tools/prepare_host.sh .env
              docker compose -f ./docker/webapi.yml --env-file .env --profile edge pull
              docker compose -f ./docker/webapi.yml --env-file .env --profile edge up -d
            '
