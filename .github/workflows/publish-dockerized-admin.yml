name: BoltonCup.Admin Docker Image CI

on:
  push:
    branches:
      - main
    # Every project the image builds, so a change to any of them is deployed.
    paths:
      - 'src/BoltonCup.Admin/**'
      - 'src/BoltonCup.Application/**'
      - 'src/BoltonCup.Common/**'
      - 'src/BoltonCup.Core/**'
      - 'src/BoltonCup.Integrations/**'
      - 'src/BoltonCup.Persistence/**'
      - 'src/BoltonCup.SessionStorage/**'
      - 'src/BoltonCup.Shared/**'
      - 'src/BoltonCup.WebAPI.Client/**'
      - 'src/BoltonCup.WebAPI/src/BoltonCup.WebAPI.json'
      - '.github/workflows/publish-dockerized-admin.yml'
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./src
        file: src/BoltonCup.Admin/src/Dockerfile
        push: true
        tags: bolst/boltoncup-admin:latest
